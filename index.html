<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Return Protocol — Retorno Pós-Lesão</title>
<!--
  ================================================================
  RETURN PROTOCOL  ·  state machine de retorno pós-lesão
  ----------------------------------------------------------------
  Gamifica ADERÊNCIA, não avanço de carga. XP por esperar as 48h,
  reportar sintoma honesto, manter RIR no alvo, fechar limpo.
  Nunca por subir peso. Avanço de estágio travado no tempo real.
  Motor reutilizável: fecha o bloco -> nova temporada.
  ================================================================
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg:#0e1116; --surf:#161b22; --surf-2:#1c232d; --line:#2b333d; --line-2:#3a444f;
    --ink:#e7ecf1; --ink-soft:#8b95a1; --ink-dim:#5b6470;
    --xp:#a78bfa; --xp-bg:#221d3a; --xp-glow:rgba(167,139,250,.28);
    --clean:#4fd08a; --clean-bg:#123024;
    --pending:#e5b04a; --pending-bg:#332813;
    --flagged:#f0714f; --flagged-bg:#3a1c15;
    --lock:#4a515c;
    --mono:'Space Mono',ui-monospace,monospace; --sans:'Archivo',system-ui,sans-serif; --r:6px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--sans); background:var(--bg); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased; padding-bottom:90px; }
  .wrap { max-width:720px; margin:0 auto; padding:0 16px; }

  /* ---- reveal (fade-in-up com stagger) ---- */
  @keyframes fadeInUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  .reveal { opacity:0; animation:fadeInUp .6s cubic-bezier(.16,1,.3,1) forwards; }

  /* ---- HUD ---- */
  .hud { padding:22px 0 18px; border-bottom:1px solid var(--line); }
  .hud-top { display:flex; align-items:center; gap:14px; }
  .rank { width:54px; height:54px; flex-shrink:0; border-radius:12px; background:var(--xp-bg); border:1px solid var(--xp); display:grid; place-items:center; font-family:var(--sans); font-weight:900; font-size:26px; color:var(--xp); line-height:1; }
  .rank-meta { flex:1; min-width:0; }
  .rank-name { font-size:19px; font-weight:800; letter-spacing:.02em; text-transform:uppercase; }
  .rank-sub { font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin-top:1px; }
  .season { font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); border:1px solid var(--line-2); border-radius:20px; padding:4px 10px; }
  .xpbar { height:8px; background:var(--xp-bg); border-radius:20px; margin-top:14px; overflow:hidden; }
  .xpfill { height:100%; background:var(--xp); border-radius:20px; width:0%; transition:width 1.5s cubic-bezier(0.1,1,0.1,1); }
  .xpnums { display:flex; justify-content:space-between; font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); margin-top:5px; }

  /* ---- mapa de estágios ---- */
  .map { padding:20px 0; }
  .map-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; }
  .map-title { font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); }
  .map-hint { margin-top:14px; }
  .stages { display:flex; align-items:flex-start; }
  .stage { flex:1; text-align:center; position:relative; opacity:1; transition:opacity .45s ease; }
  .stage.locked { opacity:.4; }
  .stage .conn { position:absolute; top:16px; left:50%; width:100%; height:2px; background:var(--line); z-index:0; transition:background .45s ease; }
  .stage:last-child .conn { display:none; }
  .stage.done .conn { background:var(--clean); }
  .node { width:34px; height:34px; border-radius:50%; margin:0 auto 8px; display:grid; place-items:center; position:relative; z-index:1; background:var(--surf); border:2px solid var(--line-2); font-family:var(--sans); font-weight:800; font-size:14px; color:var(--ink-soft); transition:background .3s, border-color .3s, color .3s; }
  .stage.done .node { background:var(--clean-bg); border-color:var(--clean); color:var(--clean); }
  .stage.now .node { background:var(--xp-bg); border-color:var(--xp); color:var(--xp); animation:pulseNow 2.2s ease-in-out infinite; }
  .stage.locked .node { color:var(--lock); }
  .node.pop { animation:pop .55s cubic-bezier(.2,1.5,.4,1); }
  @keyframes pulseNow { 0%,100%{ box-shadow:0 0 0 4px var(--xp-glow); } 50%{ box-shadow:0 0 0 8px rgba(167,139,250,.06); } }
  @keyframes pop { 0%{ transform:scale(.5); opacity:.2; } 60%{ transform:scale(1.22); } 100%{ transform:scale(1); opacity:1; } }
  .stage-label { font-size:11px; color:var(--ink-soft); font-weight:600; }
  .stage.now .stage-label { color:var(--ink); }
  .stage-unlock { font-family:var(--mono); font-size:9.5px; color:var(--ink-dim); margin-top:3px; line-height:1.35; }
  .stage.done .stage-unlock, .stage.now .stage-unlock { color:var(--ink-soft); }

  /* ---- painéis ---- */
  .panel { background:var(--surf); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:14px; }
  .ptitle { font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:12px; display:flex; justify-content:space-between; align-items:baseline; }

  /* ---- gate ---- */
  .gate { border-left:3px solid var(--line-2); background:var(--surf-2); border-radius:var(--r); padding:14px 16px; display:flex; gap:12px; align-items:flex-start; }
  .gate.clean { border-color:var(--clean); }
  .gate.pending { border-color:var(--pending); }
  .gate.flagged { border-color:var(--flagged); }
  .gate-dot { width:11px; height:11px; border-radius:50%; margin-top:6px; flex-shrink:0; background:var(--line-2); }
  .gate.clean .gate-dot { background:var(--clean); }
  .gate.pending .gate-dot { background:var(--pending); animation:pulse 2s ease-in-out infinite; }
  .gate.flagged .gate-dot { background:var(--flagged); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .gate-verdict { font-weight:700; font-size:16px; letter-spacing:-.01em; }
  .gate-detail { font-size:13px; color:var(--ink-soft); margin-top:3px; }

  /* ---- picker ---- */
  .picker { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:4px; }
  .picker button { font-family:var(--mono); font-weight:700; font-size:17px; padding:12px 0 8px; cursor:pointer; background:var(--surf-2); border:1px solid var(--line); border-radius:var(--r); color:var(--ink); transition:transform .1s ease, background .14s, border-color .14s, color .14s; }
  .picker button .pl { display:block; font-family:var(--sans); font-weight:600; font-size:9px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }
  .picker button:hover { border-color:var(--line-2); }
  .picker button:active { transform:scale(.95); }
  .picker button.active { background:var(--xp-bg); border-color:var(--xp); color:var(--xp); }
  .picker button.active .pl { color:var(--xp); opacity:.8; }

  #exlist { transition:opacity .15s ease; }
  #exlist.fading { opacity:0; }
  .exhead { display:grid; grid-template-columns:1fr 52px 52px 46px; gap:7px; font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); padding:10px 0 6px; border-bottom:1px solid var(--line-2); }
  .exhead span:not(:first-child){ text-align:center; }
  .exrow { display:grid; grid-template-columns:1fr 52px 52px 46px; gap:7px; align-items:end; padding:11px 0; border-bottom:1px solid var(--line); }
  .exrow:last-child { border-bottom:none; }
  .coresub { font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:.1em; color:var(--xp); padding:14px 0 4px; border-top:1px dashed var(--line-2); margin-top:6px; }
  .exname { font-size:13.5px; font-weight:500; }
  .extarget { font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); margin-top:2px; }
  .exhint { font-family:var(--mono); font-size:10px; color:var(--clean); margin-top:2px; }
  .field label { display:block; font-family:var(--mono); font-size:8.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:3px; }
  .field input { width:100%; font-family:var(--mono); font-size:13.5px; padding:7px 4px; text-align:center; border:1px solid var(--line-2); border-radius:var(--r); background:var(--bg); color:var(--ink); transition:border-color .18s ease, box-shadow .18s ease; }
  .field input:focus { outline:none; border-color:var(--xp); box-shadow:0 0 0 3px var(--xp-glow); }

  /* ---- botões ---- */
  .btn { font-family:var(--sans); font-weight:700; font-size:13.5px; padding:10px 16px; cursor:pointer; border-radius:var(--r); border:1px solid var(--xp); background:var(--xp); color:#14101f; transition:opacity .12s, transform .1s ease; }
  .btn:hover { opacity:.9; }
  .btn:active { transform:scale(.97); }
  .btn.ghost { background:transparent; color:var(--ink); border-color:var(--line-2); }
  .btn.sm { padding:7px 11px; font-size:12px; }
  .btn.clean-btn { background:var(--clean); border-color:var(--clean); color:#08160f; }
  .btn.flag-btn { background:var(--flagged); border-color:var(--flagged); color:#1f0d08; }
  .btnrow { display:flex; gap:9px; margin-top:14px; flex-wrap:wrap; align-items:center; }
  .note { font-family:var(--mono); font-size:11px; color:var(--ink-soft); line-height:1.6; }
  .warn { background:var(--flagged-bg); border-left:3px solid var(--flagged); padding:8px 12px; border-radius:var(--r); font-size:12.5px; margin-top:8px; }

  /* ---- feed / história ---- */
  .feed { display:grid; gap:7px; }
  .fev { display:flex; justify-content:space-between; align-items:center; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--line); }
  .fev:last-child { border:none; }
  .fev .amt { font-family:var(--mono); font-weight:700; color:var(--xp); }
  .fev .rsn { color:var(--ink-soft); }
  .hitem { display:flex; gap:11px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .hitem:last-child { border-bottom:none; }
  .htag { font-family:var(--mono); font-weight:700; font-size:12px; width:25px; height:25px; display:grid; place-items:center; border:1px solid var(--line-2); border-radius:var(--r); flex-shrink:0; color:var(--ink-soft); }
  .hmeta { flex:1; min-width:0; }
  .hdate { font-family:var(--mono); font-size:11.5px; }
  .hex { font-size:11px; color:var(--ink-soft); }
  .pill { font-family:var(--mono); font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:3px 8px; border-radius:20px; flex-shrink:0; }
  .pill.clean { background:var(--clean-bg); color:var(--clean); }
  .pill.pending { background:var(--pending-bg); color:var(--pending); }
  .pill.flagged { background:var(--flagged-bg); color:var(--flagged); }
  .empty { color:var(--ink-soft); font-size:13px; font-style:italic; padding:6px 0; }

  footer { margin-top:24px; padding-top:14px; border-top:1px solid var(--line); display:flex; gap:9px; flex-wrap:wrap; justify-content:space-between; align-items:center; }

  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); opacity:0; pointer-events:none; background:var(--xp); color:#14101f; font-weight:700; font-size:14px; padding:11px 20px; border-radius:30px; transition:all .3s ease; z-index:50; font-family:var(--mono); }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:540px){ .exrow,.exhead{ grid-template-columns:1fr 44px 44px 42px; gap:5px; } .stage-unlock{ display:none } }

  @media (prefers-reduced-motion:reduce){
    .reveal { opacity:1; animation:none; }
    .xpfill { transition:none; }
    .gate-dot, .stage.now .node, .node.pop { animation:none !important; }
    .picker button:active, .btn:active { transform:none; }
    #exlist { transition:none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hud reveal" style="animation-delay:0ms">
    <div class="hud-top">
      <div class="rank" id="rankBadge">1</div>
      <div class="rank-meta">
        <div class="rank-name" id="rankName">Reabilitação</div>
        <div class="rank-sub">nível <span id="lvlNum">1</span> · <span id="xpTotal">0</span> XP acumulado</div>
      </div>
      <div class="season">Temporada <span id="seasonNum">1</span></div>
    </div>
    <div class="xpbar"><div class="xpfill" id="xpFill"></div></div>
    <div class="xpnums"><span id="xpCur">0 XP</span><span id="xpNext">próximo nível: 100</span></div>
  </div>

  <div class="map reveal" style="animation-delay:90ms">
    <div class="map-head">
      <div class="map-title">Mapa do bloco · semana <span id="mapWeek">1</span>/4</div>
      <button class="btn ghost sm" id="advanceWeek">avançar semana ▸</button>
    </div>
    <div class="stages" id="stages"></div>
    <div class="map-hint note" id="mapHint"></div>
  </div>

  <div class="panel reveal" style="animation-delay:180ms">
    <div class="ptitle"><span>Portão · treino <span id="gateWorkout">A</span></span></div>
    <div class="gate" id="gate">
      <div class="gate-dot"></div>
      <div><div class="gate-verdict" id="gateVerdict">Baseline</div><div class="gate-detail" id="gateDetail"></div></div>
    </div>
    <div id="pendingActions"></div>
  </div>

  <div class="panel reveal" style="animation-delay:270ms">
    <div class="ptitle"><span>Registrar sessão</span></div>
    <div class="picker" id="picker"></div>
    <div class="exhead"><span>Exercício</span><span>Peso</span><span>Reps</span><span>RIR</span></div>
    <div id="exlist"></div>
    <div id="sessionWarn"></div>
    <div class="btnrow">
      <button class="btn" id="saveSession">Salvar sessão</button>
      <span class="note">Ao salvar, a sessão fica <b>pendente</b> até você resolver as 48h.</span>
    </div>
  </div>

  <div class="panel reveal" style="animation-delay:360ms">
    <div class="ptitle"><span>Como você ganha XP</span></div>
    <div class="feed" id="feed"></div>
  </div>

  <div class="panel reveal" style="animation-delay:450ms">
    <div class="ptitle"><span>Histórico</span><span class="note" id="histcount" style="margin:0"></span></div>
    <div id="history"></div>
  </div>

  <footer class="reveal" style="animation-delay:540ms">
    <span class="note">Dados no seu navegador. Nada sai daqui.</span>
    <div style="display:flex;gap:7px">
      <button class="btn ghost sm" id="exportBtn">Exportar</button>
      <button class="btn ghost sm" id="importBtn">Importar</button>
      <button class="btn ghost sm" id="resetBtn">Zerar</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </footer>

</div>
<div id="toast"></div>

<script>
"use strict";

const WORKOUTS = {
  A:{ label:"Costas", ex:[
    {name:"Puxada frente na polia",target:"3×12-15"},
    {name:"Remada máquina (peito apoiado)",target:"3×12-15"},
    {name:"Remada baixa pegada neutra",target:"3×12"},
    {name:"Rosca no cabo (excêntrica)",target:"2×12-15"},
    {name:"Rosca martelo",target:"2×12-15"},
  ]},
  B:{ label:"Peito", ex:[
    {name:"Supino máquina / Hammer",target:"3×12-15"},
    {name:"Supino inclinado halteres",target:"3×12"},
    {name:"Desenvolvimento máquina",target:"3×12-15"},
    {name:"Elevação lateral",target:"3×15"},
    {name:"Peck deck",target:"2×15"},
  ]},
  C:{ label:"Pernas", ex:[
    {name:"Leg press",target:"3×12-15"},
    {name:"Cadeira extensora",target:"3×15"},
    {name:"Mesa flexora / stiff leve",target:"3×12"},
    {name:"Panturrilha",target:"3×15-20"},
    {name:"Dead bug",target:"3×10/lado"},
    {name:"Crunch no cabo / máquina",target:"3×15"},
    {name:"Pallof press no cabo",target:"2×12/lado"},
  ]},
  D:{ label:"Ombro", ex:[
    {name:"Desenvolvimento halteres sentado",target:"3×12"},
    {name:"Elevação lateral",target:"3×15"},
    {name:"Tríceps corda na polia",target:"3×12-15"},
    {name:"Tríceps máquina",target:"2×15"},
    {name:"Flexão/extensão de punho",target:"2×15-20"},
    {name:"Pronossupinação leve",target:"2×15"},
  ]},
};

const CORE_BLOCK = [
  {name:"Dead bug",target:"3×10/lado"},
  {name:"Crunch no cabo / máquina",target:"3×15"},
  {name:"Elevação de pernas (banco)",target:"3×12-15"},
  {name:"Pallof press no cabo",target:"2×12/lado"},
];

const RIR_TARGET = { 1:[3,4], 2:[3,3], 3:[2,3], 4:[2,2] };

const STAGES = [
  { week:1, label:"Baseline",     unlock:"Fundação" },
  { week:2, label:"Ajuste carga", unlock:"+5-10%" },
  { week:3, label:"Reintrodução", unlock:"Tríceps testa + supino livre" },
  { week:4, label:"Consolidação", unlock:"Prep mês 2" },
];

const GATE_WINDOW_H = 48;
const XP = { session:10, discipline:15, cleanOnTime:40, cleanEarly:15, honesty:20, stageClear:100 };
const RANKS = [
  { min:0,name:"Reabilitação" },{ min:100,name:"Base" },{ min:250,name:"Reconstrução" },
  { min:450,name:"Reforço" },{ min:700,name:"Retorno" },{ min:1000,name:"Progressão" },
  { min:1400,name:"Força" },{ min:1900,name:"Domínio" },
];

const KEY = "return_protocol_v2";
const defaultState = () => ({ season:1, week:1, selected:"A", xp:0, sessions:[], feed:[] });
let state = load();
let coreOn = false;         // 2º bloco de core (A/B) — transitório
let justUnlockedWeek = 0;   // dispara o "pop" no nó recém-liberado

function load(){ try{ const r=localStorage.getItem(KEY); return r?Object.assign(defaultState(),JSON.parse(r)):defaultState(); }catch{ return defaultState(); } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){ console.error(e); } }

function grantXP(amount, reason){
  state.xp += amount;
  state.feed.unshift({ amount, reason, ts:Date.now() });
  state.feed = state.feed.slice(0,8);
  toast(`+${amount} XP · ${reason}`);
}
function rankFor(xp){
  let idx=0; for(let i=0;i<RANKS.length;i++) if(xp>=RANKS[i].min) idx=i;
  const cur=RANKS[idx], next=RANKS[idx+1]||null;
  const floor=cur.min, ceil=next?next.min:cur.min;
  const pct=next?Math.round(((xp-floor)/(ceil-floor))*100):100;
  return { level:idx+1, name:cur.name, pct, ceil, next };
}

function lastSessionOf(w){ const l=state.sessions.filter(s=>s.workout===w); return l.length?l[l.length-1]:null; }
function hoursSince(iso){ return (Date.now()-new Date(iso).getTime())/3.6e6; }

function gateFor(w){
  const last=lastSessionOf(w);
  if(!last) return { status:"baseline", verdict:"Baseline", detail:"Primeira sessão deste treino. Carga onde 15 reps parece fácil (daria ~20).", canProgress:false };
  if(last.gate.status==="pending"){
    const h=hoursSince(last.date), left=Math.max(0,GATE_WINDOW_H-h);
    return { status:"pending", verdict:"Aguardando janela de 48h",
      detail: h>=GATE_WINDOW_H ? "Já passou 48h. Resolve o portão abaixo antes de subir carga." : `Faltam ~${Math.ceil(left)}h pra fechar a janela. Registrar pode; subir carga não.`,
      canProgress:false, last };
  }
  if(last.gate.status==="flagged")
    return { status:"flagged", verdict:"Travado — sintoma na última janela", detail:"Repete a carga anterior. Não sobe. Segura mais 7 dias neste treino.", canProgress:false, last };
  return { status:"clean", verdict:"Liberado pra progredir", detail:"Última janela fechou limpa. Pode subir 5-10% onde 15 reps ficou fácil. Uma variável por vez.", canProgress:true, last };
}

const $ = id => document.getElementById(id);
function render(){ renderHUD(); renderMap(); renderPicker(); renderGate(); renderExercises(); renderFeed(); renderHistory(); }

function renderHUD(){
  const r=rankFor(state.xp);
  $("rankBadge").textContent=r.level; $("rankName").textContent=r.name; $("lvlNum").textContent=r.level;
  $("xpTotal").textContent=state.xp; $("seasonNum").textContent=state.season;
  $("xpFill").style.width=r.pct+"%"; $("xpCur").textContent=state.xp+" XP";
  $("xpNext").textContent=r.next?`próximo nível: ${r.ceil}`:"nível máximo";
}

function renderMap(){
  $("mapWeek").textContent=state.week;
  $("stages").innerHTML=STAGES.map(s=>{
    const cls=s.week<state.week?"done":s.week===state.week?"now":"locked";
    const glyph=s.week<state.week?"✓":s.week;
    const pop=(s.week===justUnlockedWeek)?" pop":"";
    return `<div class="stage ${cls}"><div class="conn"></div><div class="node${pop}">${glyph}</div><div class="stage-label">Sem ${s.week}</div><div class="stage-unlock">${s.unlock}</div></div>`;
  }).join("");
  $("mapHint").textContent = 'A semana sobe sozinha ao fechar um portão limpo após 48h reais. Resolver "cedo" dá XP mas não avança — por isso o mapa segura. Já rodou A-D e quer subir? Use avançar semana.';
  justUnlockedWeek=0;
}

function renderPicker(){
  $("picker").innerHTML=Object.keys(WORKOUTS).map(k=>`<button data-w="${k}" class="${k===state.selected?"active":""}">${k}<span class="pl">${WORKOUTS[k].label}</span></button>`).join("");
  $("picker").querySelectorAll("button").forEach(b=> b.onclick=()=>{
    if(b.dataset.w===state.selected) return;
    const list=$("exlist");
    list.classList.add("fading");                 // fade-out do treino atual
    setTimeout(()=>{                               // troca + fade-in do novo
      state.selected=b.dataset.w; coreOn=false; save();
      renderPicker(); renderGate(); renderExercises();
      list.classList.remove("fading");
    },150);
  });
}

function renderGate(){
  const g=gateFor(state.selected);
  $("gateWorkout").textContent=state.selected;
  $("gate").className="gate "+(g.status==="baseline"?"":g.status);
  $("gateVerdict").textContent=g.verdict; $("gateDetail").textContent=g.detail;
  const box=$("pendingActions");
  if(g.status==="pending"&&g.last){
    const ready=hoursSince(g.last.date)>=GATE_WINDOW_H;
    box.innerHTML=`<div class="note" style="margin-top:10px">Sessão de ${fmtDate(g.last.date)} · como o cotovelo respondeu?</div>
      ${!ready?`<div class="note" style="color:var(--pending)">Ainda dentro da janela — o ideal é esperar fechar 48h. Resolver limpo agora dá menos XP.</div>`:""}
      <div class="btnrow"><button class="btn clean-btn sm" id="resolveClean">Limpo · sem sintoma</button><button class="btn flag-btn sm" id="resolveFlag">Sintoma · dor/inchaço</button></div>`;
    $("resolveClean").onclick=()=>resolveGate(g.last.id,"clean");
    $("resolveFlag").onclick=()=>resolveGate(g.last.id,"flagged");
  } else box.innerHTML="";
}

function exRowHTML(ex, last){
  const prev=lastWeightFor(state.selected,ex.name);
  let hint=""; if(last&&prev!=null) hint=`<div class="exhint">sugerido ${round(prev*1.05)}–${round(prev*1.10)}</div>`;
  return `<div class="exrow" data-name="${ex.name}"><div><div class="exname">${ex.name}</div><div class="extarget">${ex.target}</div>${hint}</div>
    <div class="field"><label>kg</label><input type="number" step="0.5" inputmode="decimal" class="in-weight" value="${prev??""}"></div>
    <div class="field"><label>reps</label><input type="number" inputmode="numeric" class="in-reps"></div>
    <div class="field"><label>rir</label><input type="number" inputmode="numeric" class="in-rir"></div></div>`;
}

function renderExercises(){
  const g=gateFor(state.selected), last=g.canProgress?g.last:null;
  const canCore = state.selected==="A"||state.selected==="B";
  let html = WORKOUTS[state.selected].ex.map(ex=>exRowHTML(ex,last)).join("");
  if(canCore){
    html += `<div style="padding-top:12px"><button class="btn ghost sm" id="coreToggle">${coreOn?"− remover core":"+ adicionar core"}</button> <span class="note">2ª sessão de core da semana (a 1ª fica no C).</span></div>`;
    if(coreOn){ html += `<div class="coresub">Core</div>` + CORE_BLOCK.map(ex=>exRowHTML(ex,last)).join(""); }
  }
  $("exlist").innerHTML=html;
  if(canCore){ $("coreToggle").onclick=()=>{ coreOn=!coreOn; renderExercises(); }; }
}

function renderFeed(){
  if(!state.feed.length){ $("feed").innerHTML=`<div class="note">Esperar as 48h · reportar sintoma honesto · manter RIR no alvo · fechar limpo. Nada de XP por subir peso.</div>`; return; }
  $("feed").innerHTML=state.feed.map(f=>`<div class="fev"><span class="rsn">${f.reason}</span><span class="amt">+${f.amount}</span></div>`).join("");
}

function renderHistory(){
  const list=[...state.sessions].reverse();
  $("histcount").textContent=state.sessions.length?`${state.sessions.length} sessões`:"";
  if(!list.length){ $("history").innerHTML=`<div class="empty">Nenhuma sessão ainda.</div>`; return; }
  $("history").innerHTML=list.map(s=>{
    const done=s.exercises.filter(e=>e.weight||e.reps).length;
    const st=s.gate.status, label=st==="clean"?"limpo":st==="flagged"?"sintoma":"pendente";
    return `<div class="hitem"><div class="htag">${s.workout}</div><div class="hmeta"><div class="hdate">${fmtDate(s.date)} · sem ${s.week}</div><div class="hex">${done} exercícios</div></div><span class="pill ${st}">${label}</span></div>`;
  }).join("");
}

function saveSession(){
  const [tLo]=RIR_TARGET[state.week];
  const exercises=[]; let belowTarget=0, ratedRIR=0;
  document.querySelectorAll(".exrow").forEach(r=>{
    const name=r.dataset.name;
    const weight=numOrNull(r.querySelector(".in-weight").value);
    const reps=numOrNull(r.querySelector(".in-reps").value);
    const rir=numOrNull(r.querySelector(".in-rir").value);
    if(weight!=null||reps!=null){ exercises.push({name,weight,reps,rir}); if(rir!=null){ ratedRIR++; if(rir<tLo) belowTarget++; } }
  });
  if(!exercises.length){ warn("Registra pelo menos um exercício (peso ou reps)."); return; }
  state.sessions.push({ id:crypto.randomUUID?crypto.randomUUID():String(Date.now()), date:new Date().toISOString(), workout:state.selected, week:state.week, exercises, gate:{status:"pending",resolvedDate:null} });
  grantXP(XP.session,"Sessão registrada");
  if(ratedRIR>0&&belowTarget===0){ grantXP(XP.discipline,"Disciplina · RIR no alvo"); clearWarn(); }
  else if(belowTarget>0){ warn(`${belowTarget} exercício(s) com RIR abaixo do alvo (${tLo}). Falha não entra nesta fase — sem bônus de disciplina. Para com mais reps na reserva.`); }
  coreOn=false; save(); render();
}

function resolveGate(id, status){
  const s=state.sessions.find(x=>x.id===id); if(!s) return;
  const onTime=hoursSince(s.date)>=GATE_WINDOW_H;
  s.gate.status=status; s.gate.resolvedDate=new Date().toISOString();
  if(status==="clean"){ if(onTime) grantXP(XP.cleanOnTime,"Portão limpo após 48h"); else grantXP(XP.cleanEarly,"Portão limpo (cedo)"); }
  else grantXP(XP.honesty,"Sintoma reportado · honestidade");
  if(status==="clean"&&onTime&&state.week<4){
    if(confirm("Portão fechou limpo. Avançar para a próxima semana do bloco?")){ state.week++; justUnlockedWeek=state.week; grantXP(XP.stageClear,`Estágio ${state.week-1} concluído`); }
  } else if(status==="clean"&&onTime&&state.week===4){
    if(confirm("Bloco de 4 semanas concluído! Iniciar próxima temporada? (mantém nível e XP)")){ grantXP(XP.stageClear,"Bloco concluído"); state.season++; state.week=1; justUnlockedWeek=1; }
  }
  save(); render();
}

function advanceWeekManual(){
  if(state.week>=4){
    if(confirm("Semana 4 é a última do bloco. Concluir e iniciar a próxima temporada? (mantém nível e XP)")){ state.season++; state.week=1; justUnlockedWeek=1; save(); render(); }
    return;
  }
  if(confirm("Avançar para a semana "+(state.week+1)+"?\n\nFaça isso só se já completou o ciclo A-D desta semana. Não gera o XP de estágio — esse fica reservado pro portão limpo após 48h.")){
    state.week++; justUnlockedWeek=state.week; save(); render();
  }
}

function lastWeightFor(w,name){ const l=state.sessions.filter(s=>s.workout===w); for(let i=l.length-1;i>=0;i--){ const e=l[i].exercises.find(x=>x.name===name); if(e&&e.weight!=null) return e.weight; } return null; }
function numOrNull(v){ const n=parseFloat(v); return Number.isFinite(n)?n:null; }
function round(n){ return Math.round(n*2)/2; }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }
function warn(m){ $("sessionWarn").innerHTML=`<div class="warn">${m}</div>`; }
function clearWarn(){ $("sessionWarn").innerHTML=""; }

let toastTimer;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200); }

function exportJSON(){ const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`return-protocol-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(a.href); }
function importJSON(file){ const r=new FileReader(); r.onload=()=>{ try{ const p=JSON.parse(r.result); if(!p||!Array.isArray(p.sessions)) throw 0; state=Object.assign(defaultState(),p); save(); render(); }catch{ alert("Arquivo inválido."); } }; r.readAsText(file); }

$("saveSession").onclick=saveSession;
$("advanceWeek").onclick=advanceWeekManual;
$("exportBtn").onclick=exportJSON;
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=e=> e.target.files[0]&&importJSON(e.target.files[0]);
$("resetBtn").onclick=()=>{ if(confirm("Apagar tudo, incluindo nível e XP?")){ state=defaultState(); coreOn=false; save(); render(); } };

render();

/* barra de XP: enche de 0% até o valor atual no primeiro carregamento */
$("xpFill").style.width="0%";
requestAnimationFrame(()=>requestAnimationFrame(()=>{ $("xpFill").style.width=rankFor(state.xp).pct+"%"; }));
</script>
</body>
</html>
